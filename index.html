<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynapseKit Live — demo</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html,body{margin:0;height:100%;background:#0b0e16;color:#e7eaf3;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
  .title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:.2px;opacity:.9}
  .title svg{width:24px;height:24px;display:block}
  .title b{color:#22c55e;font-weight:700}
  video{max-width:min(1100px,100%);max-height:84vh;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.55);background:#000}
  a{color:#22c55e;text-decoration:none;font-size:12.5px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="skg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>
      <circle cx="8" cy="16" r="4.5" fill="url(#skg)"/><circle cx="25" cy="7" r="3.5" fill="#22c55e" opacity=".9"/><circle cx="25" cy="25" r="3.5" fill="#22c55e" opacity=".9"/>
      <line x1="12" y1="13.5" x2="22" y2="9" stroke="url(#skg)" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="18.5" x2="22" y2="23" stroke="url(#skg)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span><b>SynapseKit</b> Live — watch your agents think</span>
  </div>
  <video src="synapsekit-live-demo.mp4" poster="poster.jpg" controls autoplay muted playsinline></video>
  <a href="https://github.com/SynapseKit/SynapseKit">← github.com/SynapseKit/SynapseKit</a>
</div>
</body>
</html>
